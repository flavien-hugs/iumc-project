name: CI

on:
  push:
    branches: [main, develop]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend — lint & tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: iumc
          POSTGRES_PASSWORD: iumc
          POSTGRES_DB: iumc
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U iumc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://iumc:iumc@localhost:5432/iumc
      REDIS_URL: redis://localhost:6379/0
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: "Installer les dépendances (dont dev: ruff, pytest)"
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check app

      - name: Migrations (schéma à jour avant les tests)
        run: alembic upgrade head

      - name: Tests (pytest)
        run: |
          set +e
          pytest
          code=$?
          set -e
          if [ "$code" -eq 5 ]; then
            echo "::notice::Aucun test collecté pour l'instant — étape ignorée sans échec."
          elif [ "$code" -ne 0 ]; then
            exit "$code"
          fi

  frontend:
    name: Frontend — check (website & admin)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Vérification des types — website
        run: npm run check --workspace=@iumc/website

      - name: Vérification des types — admin
        run: npm run check --workspace=@iumc/admin

  build-and-push:
    name: Build & push — ${{ matrix.image }}
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend
            context: ./backend
            dockerfile: ./backend/Dockerfile
          - image: web
            context: ./frontend
            dockerfile: ./frontend/apps/website/Dockerfile
          - image: admin
            context: ./frontend
            dockerfile: ./frontend/apps/admin/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Connexion à ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.MY_GITHUB_TOKEN }}

      - name: Métadonnées de l'image (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,prefix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      # Sur une pull request : build de validation seulement (pas de push,
      # les forks n'ont de toute façon pas accès en écriture au registre).
      - name: Build ${{ github.event_name != 'pull_request' && '& push' || '' }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
