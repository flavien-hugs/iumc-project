# Reverse proxy de production (ADR-0007). Nom de domaine et certificats
# à renseigner lors de la mise en production (PRD section 24).

server {
    listen 80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name _;

    ssl_certificate /etc/letsencrypt/live/CHANGEME/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/CHANGEME/privkey.pem;

    client_max_body_size 20m;

    # Flux SSE des notifications (ADR-0016) : bloc dédié, plus spécifique que
    # /api/ ci-dessous, pour désactiver le buffering et étendre le délai
    # d'inactivité sans changer le comportement du reste de l'API.
    location = /api/v1/admin/notifications/stream {
        proxy_pass http://backend:8000/api/v1/admin/notifications/stream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Panel d'administration : app dédiée (ADR-0013), routes sous /admin.
    location /admin {
        proxy_pass http://admin:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://website:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
